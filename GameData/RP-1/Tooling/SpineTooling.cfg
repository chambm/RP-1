// Tool the ProceduralParts "Spine" (lofted) shape as its min + max bounding cylinders via
// ModuleToolingSpine (both must be tooled; a constant section collapses to a single tooling).
// Swaps the diam-len tank tooling for the spine-aware one on any proc part that can be a Spine.
// No-op unless the custom ProceduralParts build (Spine shape + MinBoundingDiameter) is installed.
@PART[*]:HAS[@MODULE[ProceduralShapeSpine],@MODULE[ModuleToolingPTank]]:AFTER[RP-0]
{
	@MODULE[ModuleToolingPTank]
	{
		@name = ModuleToolingSpine
	}
}
